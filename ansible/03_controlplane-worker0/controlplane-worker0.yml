---
- name: 01 - Configure Control Plane
  hosts: internal
  become: true
  remote_user: "{{ ansible_user }}"
  gather_facts: true

  vars:
    k8s_version: "1.35"
    calico_version: "v3.32.0"
    pod_cidr: "10.244.0.0/16"
    api_server_ip: "10.0.1.10"
    metrics_server_version: "3.12.1"

  tasks:
    # ── 1. Configure Default Gateway ───────────────────────────────────────────
    - name: Set default gateway to 10.0.0.1
      ansible.builtin.command: ip route replace default via 10.0.0.1
      changed_when: true

    - name: Persist default gateway and DNS in netplan
      ansible.builtin.copy:
        dest: /etc/netplan/00-installer-config.yaml
        content: |
          network:
            version: 2
            ethernets:
              enp7s0:
                dhcp4: true
                nameservers:
                  addresses:
                    - 8.8.8.8
                    - 1.1.1.1
                routes:
                  - to: default
                    via: 10.0.0.1
      notify: Apply netplan

    - name: Configure DNS nameservers immediately
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8
          nameserver 1.1.1.1
      changed_when: true

    # ── 2. Install Prerequisites ───────────────────────────────────────────────
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - python3-pip
        state: present
        update_cache: true

    # ── 3. Install Containerd ─────────────────────────────────────────────────
    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable systemd cgroup driver for containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        line: 'SystemdCgroup = true'
        state: present
      notify: Restart containerd

    - name: Start and enable containerd
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    # ── 4. Install Kubernetes Packages ────────────────────────────────────────
    - name: Add Kubernetes APT key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Dearmor Kubernetes key
      ansible.builtin.command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg


    - name: Add Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /"
        state: present
        filename: kubernetes

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    # ── 4b. Install etcd Client Utilities (for backup operations)
    - name: Install etcd-client package (includes etcdutl and etcdctl)
      ansible.builtin.apt:
        name: etcd-client
        state: present

    # ── 5. Disable Swap ────────────────────────────────────────────────────────
    - name: Disable swap
      ansible.builtin.command: swapoff -a
      changed_when: true

    - name: Remove swap from fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        state: absent

    # ── 6. Load Kernel Modules ─────────────────────────────────────────────────
    - name: Load kernel modules
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      ansible.builtin.lineinfile:
        path: /etc/modules-load.d/k8s.conf
        line: "{{ item }}"
        create: true
      loop:
        - overlay
        - br_netfilter

    - name: Set sysctl parameters for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward", value: "1" }

    # ── 7. Initialize Kubernetes Control Plane ─────────────────────────────────
    - name: Check if cluster is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Initialize Kubernetes cluster
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_cidr }}
        --apiserver-advertise-address={{ api_server_ip }}
        --node-name=controlplane
      when: not k8s_admin_conf.stat.exists
      register: kubeadm_init

    - name: Create .kube directory for {{ ansible_user }}
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf to {{ ansible_user }} kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy admin.conf to root kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        owner: root
        group: root
        mode: '0600'

    # ── 7b. Configure kubectl Autocomplete and Alias ───────────────────────────
    - name: Add kubectl bash completion for all users
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'source /usr/share/bash-completion/bash_completion'
        state: present
        create: true

    - name: Add kubectl bash completion for all users
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'source <(kubectl completion bash)'
        state: present

    - name: Add kubectl alias for all users
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'alias k=kubectl'
        state: present

    - name: Enable kubectl completion for alias k
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'complete -o default -F __start_kubectl k'
        state: present

    # ── 8. Install Helm ────────────────────────────────────────────────────────
    - name: Install Helm
      ansible.builtin.shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # ── 9. Install Calico ──────────────────────────────────────────────────────
    - name: Download Calico Tigera Operator manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
        dest: /tmp/tigera-operator.yaml
        mode: '0644'

    - name: Apply Tigera Operator
      ansible.builtin.command: kubectl apply -f /tmp/tigera-operator.yaml
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become_user: "{{ ansible_user }}"

    - name: Create Calico Installation manifest
      ansible.builtin.copy:
        dest: /tmp/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
                - name: default-ipv4-ippool
                  blockSize: 26
                  cidr: {{ pod_cidr }}
                  encapsulation: VXLAN
                  natOutgoing: Enabled
                  nodeSelector: all()
      become_user: "{{ ansible_user }}"

    - name: Apply Calico Installation
      ansible.builtin.command: kubectl apply -f /tmp/calico-installation.yaml
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become_user: "{{ ansible_user }}"
      when: kubeadm_init is changed

    # ── 9b. Install Metrics Server ─────────────────────────────────────────────
    - name: Add Metrics Server Helm repository
      kubernetes.core.helm_repository:
        name: metrics-server
        repo_url: https://kubernetes-sigs.github.io/metrics-server/
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become_user: "{{ ansible_user }}"

    - name: Update Helm repositories
      ansible.builtin.command: helm repo update
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become_user: "{{ ansible_user }}"

    - name: Install Metrics Server via Helm
      kubernetes.core.helm:
        name: metrics-server
        chart_ref: metrics-server/metrics-server
        chart_version: "{{ metrics_server_version }}"
        release_namespace: kube-system
        create_namespace: true
        values:
          args:
            - --kubelet-insecure-tls
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become_user: "{{ ansible_user }}"

    # ── 10. Generate Join Command ─────────────────────────────────────────────
    - name: Generate kubeadm join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_cmd
      changed_when: false

    - name: Save join command to file
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          {{ kubeadm_join_cmd.stdout }} --node-name=worker0
        dest: /tmp/kubeadm-join-command.sh
        mode: '0755'

    - name: Fetch join command to local
      ansible.builtin.fetch:
        src: /tmp/kubeadm-join-command.sh
        dest: /tmp/kubeadm-join-command.sh
        flat: true

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply

    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: 02 - Configure Worker0
  hosts: vps
  become: true
  remote_user: "{{ ansible_user }}"
  gather_facts: true

  vars:
    k8s_version: "1.35"

  tasks:

    # ── 2. Install Prerequisites ───────────────────────────────────────────────
